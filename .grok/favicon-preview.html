<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #555; font: 12px/1.2 sans-serif; color: #fff; }
  .row { display: flex; gap: 24px; padding: 16px; align-items: end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  img { image-rendering: pixelated; display: block; background: #888; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="favicon-bars.svg" width="16" height="16"><span>bars 16</span></div>
    <div class="cell"><img src="favicon-bars.svg" width="32" height="32"><span>bars 32</span></div>
    <div class="cell"><img src="favicon-bars.svg" width="64" height="64"><span>bars 64</span></div>
    <div class="cell"><img src="favicon-line.svg" width="16" height="16"><span>line 16</span></div>
    <div class="cell"><img src="favicon-line.svg" width="32" height="32"><span>line 32</span></div>
    <div class="cell"><img src="favicon-line.svg" width="64" height="64"><span>line 64</span></div>
  </div>
</body>
</html>
